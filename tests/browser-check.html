<!doctype html><html><head><base href="../"><meta charset="utf-8"><link rel="stylesheet" href="jspsych.css"><link rel="stylesheet" href="study.css"></head><body>
<script src="jspsych.js"></script><script src="plugins/plugin-instructions.js"></script><script src="plugins/plugin-preload.js"></script><script src="plugins/plugin-survey-html-form.js"></script><script src="plugins/plugin-fullscreen.js"></script><script src="plugins/plugin-html-keyboard-response.js"></script>
<script src="image-manifest.js"></script><script src="consent.js"></script>
<script>
// Local-only Firebase mock: this page never contacts Firebase.
window.testWrites=[];
window.firebase={apps:[{}],auth:()=>({currentUser:{uid:'test-user'}}),database:Object.assign(()=>({ref:path=>({set:async payload=>{testWrites.push({path,payload});}})}),{ServerValue:{TIMESTAMP:123456789}})};
window.addEventListener('error', e=>{document.body.dataset.error=e.message});
</script><script src="experiment.js"></script>
<script>
(async()=>{
 const checks=[];
 function assert(ok,label){if(!ok)throw Error(label);checks.push(label);}
 const wait=ms=>new Promise(r=>setTimeout(r,ms));
 try {
 await wait(100);
 let form=document.querySelector('form');
 assert(!!form && !form.checkValidity(),'Consent blocks unchecked submission');
 assert(testWrites.length===0,'No writes before consent');
 form.querySelector('input[type=checkbox]').checked=true;form.requestSubmit();
 await wait(30);form=document.querySelector('form');
 assert(!form.checkValidity(),'Demographics block empty submission');
 const groups=Object.keys(DEMOGRAPHICS);
 groups.slice(0,-1).forEach(k=>form.querySelector(`[name="${k}"]`).checked=true);
 assert(!form.checkValidity(),'One unanswered demographic still blocks submission');
 form.querySelector(`[name="${groups.at(-1)}"]`).checked=true;
 assert(form.checkValidity(),'All demographic responses pass');form.requestSubmit();
 await wait(30);
 assert(ratingTrials.length===165,'165 image trials');
 assert(new Set(ratingTrials.map(t=>t.data.filename)).size===165,'Every image occurs once');
 assert(ratingTrials.every(t=>t.data.filename.startsWith(t.data.block==='Male'?'M':'F')),'Block prefixes correct');
 assert(ratingTrials.every(t=>t.choices.join('')==='1234567'),'Only keys 1 through 7 accepted');
 assert(timeline.filter(t=>t.data?.phase==='iti').every(t=>t.trial_duration===1000 && t.choices==='NO_KEYS'),'Every ITI is 1000ms with no responses');
 assert(timeline[0]===consent && timeline[1]===demographics,'Fixed initial consent and demographics');
 // Advance instructional/fullscreen/preload screens for a real keyboard trial.
 document.querySelector('#jspsych-instructions-next').click();await wait(30);
 document.querySelector('#jspsych-fullscreen-btn').click();
 // Wait for actual local image preloading.
 for(let i=0;i<100 && !document.querySelector("#jspsych-instructions-next");i++) await wait(100);
 document.querySelector('#jspsych-instructions-next').click();await wait(50);
 assert(!!document.querySelector('.rating'),'Rating screen rendered');
 const bounds=document.querySelector('.rating-panel').getBoundingClientRect();
 assert(bounds.top>=0 && bounds.bottom<=innerHeight,'Question and scale fit viewport');
 document.body.dispatchEvent(new KeyboardEvent('keydown',{key:'8',bubbles:true}));await wait(30);
 assert(!!document.querySelector('.rating'),'Invalid keyboard response ignored');
 document.body.dispatchEvent(new KeyboardEvent('keyup',{key:'8',bubbles:true}));
 document.body.dispatchEvent(new KeyboardEvent('keydown',{key:'4',bubbles:true}));await wait(30);
 document.body.dispatchEvent(new KeyboardEvent('keyup',{key:'4',bubbles:true}));
 assert(document.body.className==='iti-mode','Valid key enters gray ITI');
 assert(getComputedStyle(document.body).backgroundColor==='rgb(128, 128, 128)','ITI background gray');
 assert(!document.querySelector('img') && document.querySelector('.jspsych-content').textContent.trim()==='','ITI is blank');
 assert(jsPsych.data.get().filter({phase:'rating'}).values()[0].rating===4,'Numeric rating saved');
 await wait(1050);assert(!!document.querySelector('.rating'),'Next image appears after ITI');
 // Build the complete save dataset to verify schema without completing 165 manual trials.
 const rows=ratingTrials.map(t=>({...t.data,rating:4,response:'4',rt:500}));
 jsPsych.data.get=()=>({filter:()=>({values:()=>rows})});
 recruitment.cloudresearch_id = 'TEST_ID';
 await finalSave();
 assert(testWrites.length===1,'Single final Firebase write');
 const p=testWrites[0].payload;
 assert(p.consent.agreed && Object.keys(p.trials).length===165 && p.demographics.age==='18-21','Payload contains consent demographics and 165 ratings');
 assert(testWrites[0].path.startsWith('responses/test-user/'),'Write scoped to authenticated user');
 document.body.innerHTML='<pre id="result">PASS\n'+checks.join('\n')+'</pre>';
 } catch(e){document.body.innerHTML='<pre id="result">FAIL: '+e.message+'\n'+checks.join('\n')+'</pre>';}
})();
</script></body></html>
